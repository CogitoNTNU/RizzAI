[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",
    # "torch==2.1.0",
    "torch>=2.8.0",
    # "transformers==4.35.0",
    "transformers>=4.56.2",
    # "peft==0.6.0",
    "peft>=0.7.0",
    # "bitsandbytes==0.41.1",
    "bitsandbytes>=0.48.1",
    # "Pillow==10.1.0",
    "pillow>=11.3.0",
    # "accelerate==0.24.1",
    "accelerate>=1.10.1",
    # "requests==2.31.0",
    "requests>=2.32.5",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]